# Corre las pruebas automáticas y revisa el formato del código en cada cambio.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas automáticas
        run: node --test
      - name: Formato del código (Prettier)
        run: npx --yes prettier@3.3.3 --check .
